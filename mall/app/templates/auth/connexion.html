{% extends "base.html" %}
{% block title %}Connexion — {{ site_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container auth-wrap">
    <form method="post" class="panel form auth-card">
      <h1>Connexion</h1>
      <p class="muted">Clients, vendeurs et administrateur se connectent ici.</p>
      <label>E-mail<input type="email" name="email" value="{{ request.form.get('email', '') }}" required autofocus></label>
      <label>Mot de passe<input type="password" name="password" required></label>
      <button class="btn btn-block">Se connecter</button>
      <div class="auth-links">
        <span>Pas encore de compte ?</span>
        <a href="{{ url_for('auth.inscription', next=request.args.get('next')) }}">Créer un compte client</a>
        <a href="{{ url_for('auth.ouvrir_boutique') }}">Ouvrir ma boutique</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
